var RAP_CONCEPT = "랩소도는 던진 공 자체의 결과(구속·회전수·회전 효율·무브·릴리스 위치·제구)를 직접 재는 장비다. 즉 '몸이 어떻게 움직였나'가 아니라 '그 움직임이 만들어낸 공의 품질'을 숫자로 보여준다. 그래서 랩소도 값의 좋고 나쁨에는 메카닉(에너지가 다리에서 골반·몸통·팔·손으로 순서대로 전달됐는지)과 체력(하체 출력·회전 가동성·코어 안정성 등)이 주요 원인으로 작용하며, 랩소도는 그 결과를 비추는 '성적표'에 가깝다. 다만 회전수처럼 일부 지표는 개인 한계(팔 속도·팔 길이 등)의 영향이 커 동작·체력만으로 크게 바뀌지 않는 경우도 있으니, 모든 수치를 동작만 고치면 다 좋아진다고 단정하지는 않는다. 그래도 코치가 손댈 수 있는 가장 큰 지렛대는 공이 아니라 동작과 몸에 있다.";
var RAP_CONTENT = {"velo":{def:"공이 손을 떠난 순간의 속도를 잰다(표시는 km/h 또는 mph 설정에 따라 다르며, 같은 값을 단위만 바꿔 보여준다). 같은 구종에서 평균과 최고를 함께 보면 출력 수준과 안정성을 같이 가늠할 수 있다.",cause:"하체에서 만든 힘이 골반→몸통→팔→손으로 순서대로 전달되지 못하고 중간 단계에서 새는 경우가 흔하다. 앞다리 착지에서 무릎이 버텨주지 못해 회전축이 무너지거나, 몸통 회전 타이밍이 너무 일러 팔만 휘두르게 되면 속도가 안 나온다. 체력 쪽으로는 하체 출력(특히 신전·점프 파워), 회전 가동성, 코어 안정성 부족이 자주 원인이다.",effect:"구속이 늘면 타자의 반응 시간이 줄어 헛스윙·빗맞은 타구를 끌어내기 쉽고, 빠른 공과의 속도 차로 변화구 위력도 함께 살아난다. 다만 구속을 무리하게 올리려다 제구가 흔들리거나 팔 부하가 커지면 오히려 손해라, 출력과 제구·부상 위험의 균형을 함께 봐야 한다.",drill:"앞다리 착지에서 버티는 힘을 살리는 한발 착지·블로킹 드릴, 메디신볼 회전 던지기로 하체→몸통 전달 순서를 연습한다. 하체 출력은 스쿼트·점프·스프린트 계열로 따로 보강하고, 늘릴 때는 주차별 던지기 강도를 단계적으로 올려 팔 부하를 관리한다.",label:"구속 (Velocity)"},"spin":{def:"공이 1분에 몇 바퀴 도는지(rpm)를 잰다. 회전수 자체보다, 그 회전이 얼마나 무브로 바뀌는지(회전 효율)와 함께 봐야 의미가 있다.",cause:"회전수는 같은 선수 안에서 구속과 함께 오르내리는 경향이 있어, 구속 대비 회전수가 유독 낮다면 손가락이 공을 끝까지 채지 못했거나 릴리스에서 미끄러진 경우가 많다. 다만 한 선수의 회전수 상한은 팔 속도·팔 길이·손 크기 등 개인 특성의 영향이 커서, 동작이나 악력만으로 크게 끌어올리기는 어렵다. 그립이 일정하지 않거나 손에 땀·미끄러움이 있는 것도 들쭉날쭉의 원인이다.",effect:"회전수가 높고 그 회전이 효율적으로 쓰이면(유효 회전 비율이 높으면) 같은 구속이라도 무브가 커져 타자가 맞히기 어렵다. 반대로 회전수가 높아도 효율이 낮으면(겉도는 회전이 많으면) 무브로 이어지지 않으니, 회전수 한 숫자만 보고 좋다·나쁘다 단정하지 않는다.",drill:"공을 손끝으로 끝까지 채는 감각을 살리는 짧은 거리 스핀 드릴(타월·스핀볼 등)과, 매 구 그립을 같은 위치로 잡는 루틴을 반복한다. 악력·손가락 운동은 미끄러짐 방지와 일관성에 도움이 되지만 회전수 자체를 크게 올리는 마법은 아니므로, 효율과 일관성을 우선 목표로 둔다.",label:"회전수 (Spin Rate)"},"eff":{def:"전체 회전 중 실제로 공을 휘게 만드는 회전(유효 회전, 액티브 스핀)의 비율을 백분율로 본다. 나머지는 진행 방향으로 도는 '겉도는 회전(자이로 성분)'으로, 무브에 거의 기여하지 않는다.",cause:"회전축이 공의 진행 방향과 가까워질수록 자이로 성분이 늘어 효율이 떨어진다. 릴리스에서 손끝이 공을 채는 방향과 회전축이 그날그날 흔들리면 효율도 들쭉날쭉해진다. 구종마다 노리는 회전축이 다른데 그립·채는 방향이 불안정하면 의도한 효율이 안 나온다.",effect:"구종에 따라 의미가 다르다. 포심·체인지업·커브는 효율이 높을수록 의도한 무브(덜 떨어져 떠 보임·가라앉음·떨어짐)가 또렷해 위력이 산다. 반대로 슬라이더·커터는 자이로 성분을 의도적으로 쓰는 구종이라 효율이 낮은 게 정상이며, 무조건 100%가 정답이 아니다. 그래서 효율은 구종별 목표치를 따로 잡아 평가해야 한다.",drill:"릴리스에서 손끝이 공을 채는 방향을 일정하게 만드는 거울·영상 체크와, 구종별 회전축을 고정하는 그립 루틴을 잡는다. 랩소도의 회전축(시계 방향 표기)·액티브 스핀 화면을 보며 목표 축과 실제 축을 맞춰가는 피드백 연습이 효과적이다.",label:"회전 효율 (Spin Efficiency / Active Spin)"},"hb":{def:"공이 좌우로 휜 정도(cm 또는 inch)를 잰다. 같은 구속이라도 좌우 움직임이 또렷할수록 타자의 배트 중심을 비껴가기 쉽다.",cause:"좌우 무브의 방향은 회전축이, 크기는 유효 회전(회전수×효율)이 결정한다. 따라서 회전축이 눕거나 효율이 낮으면 수평 무브가 줄거나 방향이 흔들린다. 릴리스에서 손이 공의 옆면을 제대로 못 감싸거나, 팔 각도(릴리스 슬롯)가 그날그날 달라지면 수평 무브의 양과 방향이 일정하지 않다.",effect:"구종마다 노리는 방향이 다르다. 투심·싱커·체인지업은 던지는 팔 쪽으로 휘는 수평 무브가 핵심이고, 슬라이더·커터는 반대쪽(글러브 쪽)으로 휜다. 수평 무브가 또렷하면 같은 코스에서도 빗맞은 땅볼이나 헛스윙을 더 끌어낸다.",drill:"구종별 그립과 채는 방향을 고정하는 그립 루틴, 릴리스 슬롯을 일정하게 유지하는 슬롯 체크 드릴을 한다. 랩소도 무브 화면으로 목표 방향(예: 시계 9시 방향) 대비 실제를 매 구 확인하며 조정한다.",label:"수평 무브 (Horizontal Break)"},"vb":{def:"순수 중력만 받는 공과 비교해 회전 때문에 위아래로 얼마나 덜 떨어지거나 더 떨어졌는지(cm 또는 inch)를 본다. 포심이 '덜 떨어져 떠 보이는' 정도, 커브가 '더 떨어지는' 정도가 여기에 나타난다.",cause:"포심에서 수직 무브가 부족하면 보통 유효 회전(회전수×효율)이 낮거나 회전축이 누워 있는 경우다. 릴리스가 지나치게 낮거나 손끝으로 끝까지 못 채면 떠 보이는 효과가 줄어든다. 커브 계열은 반대로 공 위를 채는 힘·회전축이 약하면 낙폭이 안 나온다.",effect:"구종별로 방향이 정반대다. 포심은 수직 무브가 클수록 높은 코스에서 헛스윙·뜬공을 끌어내고, 커브·스플리터는 낙폭이 클수록 헛스윙·땅볼을 만든다. 절대값이 크다고 무조건 좋은 게 아니라, 자기 구종이 노리는 방향과 맞는지를 기준으로 봐야 한다.",drill:"포심은 손끝으로 끝까지 채 유효 회전을 올리는 드릴과 릴리스 높이를 일정하게 유지하는 연습을 한다. 커브 계열은 공 위를 감아 채는 감각 드릴을 한다. 두 경우 모두 랩소도 화면으로 목표 무브와 실제를 비교하며 잡는다.",label:"수직 무브 (Vertical Break / Induced Vertical Break)"},"command":{def:"던진 공이 스트라이크 존 어디에 들어갔는지, 스트라이크 비율과 원하는 위치에 얼마나 모이는지를 본다. 단순히 들어갔나가 아니라 '의도한 곳에 일관되게 가는가'가 핵심이다.",cause:"릴리스 포인트가 매 구 흩어지면 공도 흩어진다. 착지 위치·방향이 일정하지 않거나, 몸통 회전 타이밍의 빠르고 느린 편차가 크면 제구가 흔들린다. 피로가 쌓여 하체가 무너질 때도 제구부터 무너지는 경우가 많다.",effect:"제구가 좋으면 같은 구속·무브로도 카운트를 유리하게 끌고 가고, 볼넷과 한가운데 실투가 줄어 실점이 내려간다. 구속이 다소 낮아도 제구가 받쳐주면 충분히 경쟁력이 있다.",drill:"착지 위치와 릴리스 포인트를 일정하게 만드는 반복 루틴, 존을 9칸으로 나눠 한 칸씩 노려 던지는 커맨드 드릴을 한다. 랩소도의 릴리스 위치 화면으로 릴리스 일관성을 점검하고, 피로 시 제구가 어떻게 변하는지 기록해 투구 수·등판 간격을 관리한다.",label:"제구 (Strike%·존 위치)"},"usage":{def:"어떤 구종을 각각 몇 퍼센트씩 던지는지, 카운트·상황·좌우 타자별로 어떻게 섞는지를 본다. 한 구종의 좋고 나쁨이 아니라 전체 배합과 운영을 보는 항목이다.",cause:"특정 구종에 과하게 치우치는 건 보통 나머지 구종의 완성도나 자신감이 부족하기 때문이다. 던질 줄 아는 구종이 적거나, 좌우 타자·카운트별 선택지가 부족하면 배합이 단조로워진다.",effect:"구종 배합이 단조로우면 타자가 노림수를 좁히기 쉬워 같은 구위라도 공략당한다. 구속·무브·움직이는 방향이 서로 다른 구종을 적절히 섞으면 타자의 타이밍과 시선을 흩어 전체 위력이 올라간다. 특히 빠른 공과 떨어지는·휘는 공 사이의 '속도 차·눈높이 차'를 만드는 게 핵심이다.",drill:"약한 구종을 불펜에서 비중 있게 던져 완성도를 올리고, 좌우 타자·카운트별 배합 시나리오를 미리 정해 연습한다. 랩소도로 구종 간 구속·무브 차이를 확인해 서로 충분히 구분되는지(무브가 겹쳐 헷갈리지 않는지) 점검한다.",label:"구종 구성 (Pitch Mix)"}};
var FIT_CONCEPT = "체력은 투구 동작에 힘과 속도를 공급하는 '엔진'에 해당합니다. 하체에서 만드는 최대 힘, 폭발적으로 튀어 오르는 점프 파워, 짧은 접지에서 되튀는 반응성이 좋을수록 마운드를 밀고 몸통을 회전시킬 '연료'가 커집니다. 여기서는 각 항목을 고교 선수 규준과 비교한 백분위(상위 몇 %인지)로 보여 줍니다. 다만 체력 수치와 구속은 어느 정도 상관은 있어도 인과를 단정할 수는 없으며, 체력만으로 구속이 결정되지는 않습니다. 그래도 엔진이 약하면 만들어 낼 수 있는 힘의 상한 자체가 낮아져, 메카닉을 아무리 다듬어도 동작 보완만으로 메우는 데 한계가 생깁니다. 정리하면 메카닉은 '가진 힘을 잘 전달'하는 일이고, 체력은 '전달할 힘의 크기 자체'를 키우는 일입니다. 두 가지를 함께 봐야 합니다.";
var FIT_CONTENT = {"strength":{def:"고정된 바를 허벅지 중간 높이에서 최대로 당기는 '등척성(움직임 없이 버티는) 최대 힘'을 봅니다. 측정 전 체중에서 오는 기본값을 뺀 순수한 힘(Net)으로, 주로 하체가 주도하는 전신의 '바탕 힘' 크기입니다. 마운드를 밀고 앞다리로 버틸 때 동원되는 힘의 토대로 이해하면 됩니다.",cause:"스쿼트·데드리프트처럼 무겁게 버티는 최대근력 훈련량이 부족할 때 낮게 나옵니다. 가벼운 무게로 반복만 많이 했거나, 무거운 중량을 안전하게 다뤄 본 경험이 적을 때도 낮습니다.",effect:"최대 힘이 약하면 하체에서 낼 수 있는 추진력의 상한이 낮아 구속을 끌어올릴 여지가 줄어드는 경향이 있습니다(상관 관계이며 단정은 아님). 또 앞다리 제동이 무를 때 그 부담이 어깨·팔꿈치로 넘어가기 쉬워 부상 측면에서도 불리할 수 있습니다.",drill:"백스쿼트(가능하면 풀 깊이)와 트랩바 데드리프트를 주 2~3회, 5세트 3~5회로 무겁게(들어 올릴 때는 의도적으로 강하게) 듭니다. 한 발 스플릿 스쿼트·런지에 중량을 더해 좌우 한쪽 다리로 버티는 힘도 보강합니다. 무게는 자세가 무너지지 않는 선에서 점진적으로 올립니다.",label:"최대 힘 (IMTP Net Peak Force)"},"rel_strength":{def:"위의 최대 힘을 자기 몸무게로 나눈 값으로, '내 체중을 얼마나 잘 다루는 힘인가'를 봅니다. 절대 힘이 같아도 몸이 가벼우면 이 값이 높아져, 체중이동·회전처럼 자기 몸을 빠르게 움직이는 동작에 유리합니다.",cause:"맨몸·상대근력 훈련이 부족하거나, 근력에 비해 체중(특히 비기능적인 체지방)이 많을 때 낮게 나옵니다. 절대 힘은 좋아도 이 값이 낮으면 동작에서 몸이 무겁게 느껴질 수 있습니다.",effect:"체중 대비 힘이 낮으면 빠른 체중이동과 회전에 불리할 수 있고, 같은 동작을 해도 상대적으로 더 큰 노력이 들어 피로가 빨리 올 수 있습니다.",drill:"푸시업·턱걸이(밴드 보조 가능)·플랭크·한 발 스쿼트 같은 자기 체중 기반 근력 운동을 주 3~4회 합니다. 절대 힘이 이미 충분한데 이 값만 낮다면, 근력은 유지하면서 분모인 체중(특히 체지방)을 점진적으로 낮추는 방향도 함께 고려합니다.",label:"체중 대비 힘 (IMTP/BM)"},"power":{def:"반동 없이 쪼그려 앉은 정지 자세에서 한 번에 튀어 오르는 스쿼트 점프(SJ)의 파워를 체중으로 나눈 값입니다. 반동(되튐)을 빼고 측정해 순수하게 '힘을 빠르게 내는' 단축성(미는) 폭발력만 보는 지표입니다.",cause:"힘을 빠르게 내는 폭발성 훈련이 부족하거나, 무겁게 천천히 드는 훈련만 하고 속도 요소를 따로 키우지 않았을 때 낮게 나옵니다.",effect:"점프 파워가 낮으면 마운드를 밀어내는 추진을 빠르게 만들지 못해, 구속에 기여하는 폭발력이 약해지는 경향이 있습니다. 힘은 있어도 그 힘을 '빠르게' 쓰지 못하는 상태입니다.",drill:"스쿼트 점프·박스 점프·메디신볼 슬램을 최대한 빠르고 높게 3~5회씩 3~4세트(세트 사이 충분히 회복하며) 합니다. 폭발력 운동은 '양'보다 '질'이 핵심이므로, 높이나 속도가 눈에 띄게 떨어지면 멈추고 회복한 뒤 다시 합니다.",label:"점프 파워 (SJ Peak Power/BM)"},"rel_power":{def:"무릎을 살짝 굽혔다 펴며 반동(되튐)을 쓰는 카운터무브먼트 점프(CMJ)의 파워를 체중으로 나눈 값입니다. 근육과 힘줄이 '늘어났다 줄어드는' 신장-단축 주기(SSC)를 활용하는 능력을 보며, 이는 투구에서 체중이동의 힘을 회전으로 되받아치는 메커니즘과 닮아 있습니다.",cause:"반동으로 힘을 모았다가 한 번에 터뜨리는 협응(타이밍)이 서툴거나, 파워에 비해 체중이 많을 때 낮게 나옵니다. SJ에 비해 CMJ가 크게 낮다면 반동(SSC)을 잘 활용하지 못한다는 신호입니다.",effect:"체중 대비 파워가 낮으면 체중이동에서 회전으로 넘어가는 구간에서 탄성(되튐) 활용이 약해, 같은 힘으로도 구속을 덜 만들어 내는 경향이 있습니다.",drill:"카운터무브먼트 점프(팔을 크게 휘둘러 최고 높이로)와 broad jump(제자리 멀리뛰기)를 질 위주로 합니다. 매번 충분히 회복한 뒤 반복하고, 시도마다 '조금 더 높이·더 멀리'를 명확한 목표로 둡니다. 반동을 빠르고 부드럽게 연결하는 감각에 집중합니다.",label:"체중 대비 파워 (CMJ Peak Power/BM)"},"reactive":{def:"제자리 연속 점프(홉)에서 '땅에 닿아 있는 시간' 대비 '튀어 오른 높이'의 비율로, 얼마나 짧게 닿고 빠르게 되튀는지를 봅니다. 앞다리가 착지하자마자 단단히 버텨 그 힘을 회전으로 바꾸는 능력과 직결되는 지표입니다.",cause:"접지가 길고 무르거나(쿵 하고 주저앉음), 발목·아킬레스의 강성(stiffness)을 키우는 플라이오메트릭 훈련이 부족할 때 낮게 나옵니다. 참고로 측정 프로토콜에 따라 RSI 절대값이 달라질 수 있으므로, 다른 집단과의 절대 수치 비교보다 본인의 추세 변화를 보는 편이 신뢰도가 높습니다.",effect:"반응성이 낮으면 앞다리 제동이 무뎌져 몸통이 그 위에서 빠르게 회전하기 어려울 수 있고, 착지 충격을 빠르게 받아내지 못해 하지·허리 부담이 커질 수 있습니다.",drill:"라인 양발 홉·포고(pogo) 점프·낮은 박스 뎁스 점프로 땅에 '톡' 짧게 닿아 빠르게 튀깁니다. 주 2회, 무릎·발목에 무리가 가지 않게 푹신한 곳에서 짧은 접지부터 시작해 점차 단단한 바닥으로 옮깁니다. 충격이 큰 운동이므로 회복과 점진적 부하 증가를 지킵니다.",label:"반응성 강도 (Hop RSI)"},"upper_strength":{def:"손으로 쥐는 힘으로, 전완 근력과 전신 근력·내구성의 흐름을 간접적으로 가늠하는 대표 지표입니다. 다만 악력 자체가 구속이나 제구를 직접 만드는 변인은 아니며, 전완 컨디션과 전반적 근력 수준을 비추는 '참고 지표'로 보는 것이 맞습니다.",cause:"전완·악력 훈련이 부족하거나, 던진 양에 비해 회복이 부족해 전완이 지쳐 있을 때 낮게 나옵니다.",effect:"악력이 약하면 릴리스에서 공을 단단히 채는 감각이 떨어질 수 있습니다. 전완 내구성이 부족한 상태로 투구량이 늘면 전완·팔꿈치 안쪽 피로로 이어질 수 있으나, 악력 수치만으로 부상을 예측하거나 단정할 수는 없으니 통증·피로 신호와 함께 종합적으로 판단합니다.",drill:"악력기 반복·데드행(철봉 매달리기)·파머스 캐리(무거운 것 들고 걷기)·손가락 푸시업을 주 2~3회 합니다. 전완·팔꿈치 안쪽에 통증이 있으면 강도를 낮추고 회복을 우선하며, 투구량과의 균형을 함께 관리합니다.",label:"악력 (Grip Strength)"}};
