<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>고려대 투수 · 팀 한눈에</title>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
<style>
  :root{--bg:#0f1420;--panel:#161d2b;--panel2:#1a2130;--line:#26324a;--text:#e8ecf2;--sub:#93a6bd;--faint:#5d6b82;--gold:#e8c56a;--good:#5fce8f;--warn:#e88f6a;--bad:#e0687f;--blue:#7fb0ee}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:Pretendard,-apple-system,sans-serif;padding-bottom:40px}
  .cond{font-family:Pretendard,sans-serif} .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  .topbar{background:linear-gradient(90deg,#1a2740,#141a26);border-bottom:1px solid var(--line);color:#cfe0f5;font-size:12.5px;font-weight:600;padding:8px 20px;text-align:center;line-height:1.5}
  header{padding:22px 28px 8px;display:flex;align-items:baseline;gap:16px;flex-wrap:wrap}
  h1{font-size:25px;font-weight:800;margin:0} h1 b{color:var(--gold)}
  .sub{color:var(--sub);font-size:13.5px}
  .avgs{display:flex;gap:12px;padding:6px 28px 4px;flex-wrap:wrap}
  .avg{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 16px;min-width:120px}
  .avg .k{font-size:10.5px;color:var(--faint);text-transform:uppercase;letter-spacing:.05em}
  .avg .v{font-size:22px;font-weight:800;color:var(--gold);line-height:1.15} .avg .v small{font-size:12px;color:var(--sub);font-weight:400}
  .sortbar{padding:8px 28px 2px;display:flex;gap:7px;align-items:center;flex-wrap:wrap}
  .sortbar span{font-size:12px;color:var(--faint)}
  .sortbar button{background:var(--panel2);color:var(--sub);border:1px solid var(--line);border-radius:7px;padding:5px 12px;font-size:12.5px;font-weight:700;cursor:pointer}
  .sortbar button.on{background:var(--gold);color:#111;border-color:var(--gold)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;padding:14px 28px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:15px 17px 16px;cursor:pointer;transition:border-color .15s,transform .1s;text-decoration:none;color:inherit;display:block}
  .card:hover{border-color:var(--gold);transform:translateY(-2px)}
  .chead{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .nm{font-size:19px;font-weight:800} .nm .hand{font-size:12px;color:var(--faint);font-weight:600;margin-left:5px}
  .velo{text-align:right} .velo .n{font-size:26px;font-weight:800;color:var(--gold);line-height:1} .velo .u{font-size:11px;color:var(--sub)}
  .smalln{display:inline-block;font-size:10.5px;font-weight:700;color:var(--warn);background:rgba(232,143,106,.12);border:1px solid rgba(232,143,106,.4);border-radius:5px;padding:1px 6px;margin-left:6px;vertical-align:middle}
  .row{margin-top:11px}
  .rlab{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;margin-bottom:3px}
  .rlab .l{color:var(--sub)} .rlab .v{font-weight:800;font-family:ui-monospace,monospace}
  .bar{position:relative;height:8px;background:var(--line);border-radius:5px;overflow:hidden}
  .bar>i{position:absolute;left:0;top:0;bottom:0;border-radius:5px}
  .bn{margin-top:12px;font-size:13px;border-radius:9px;padding:8px 11px;line-height:1.5}
  .open{margin-top:11px;font-size:12px;color:var(--gold);font-weight:700;text-align:right}
  .foot{padding:8px 28px;color:var(--faint);font-size:11.5px;line-height:1.6}
</style>
</head>
<body>
<div class="topbar">고려대 전용 · <b style="color:#e8c56a">Theia 마커리스</b> · 2026년 6월 28일 측정 · OptiTrack Prime Color · 1080p · 250Hz · 지면반력 미측정(힘·임펄스 항목 제외) · 랩소도·체력 동일 세션</div>
<header>
  <h1>고려대 투수 · <b>팀 한눈에</b></h1>
  <span class="sub">선수를 누르면 개인 리포트(흐름·메카닉·랩소도·체력·동작뷰어)가 열립니다.</span>
</header>
<div class="avgs" id="avgs"></div>
<div class="sortbar"><span>정렬</span>
  <button data-s="velo" class="on">구속순</button>
  <button data-s="mech">메카닉순</button>
  <button data-s="fit">체력순</button>
  <button data-s="name">이름순</button>
</div>
<div class="grid" id="grid"></div>
<div class="foot">막대: 메카닉=엘리트 20명 기준 백분위(중간 50) · 체력=고려대 VALD 점수(100=엘리트 목표) · 병목=에너지 사슬 최상류의 충족률 낮은 단계(빨강 &lt;50%·노랑 &lt;75%). 개인 리포트와 동일 기준.</div>

<script src="데이터/teamboard.js?v=kuT0704"></script>
<script>
(function(){
  var T=(window.KU_TEAM||[]).slice();
  var G=document.getElementById('grid'), A=document.getElementById('avgs');
  function bandScore(v){ return v==null?{label:'자료 없음',color:'var(--faint)'}:(v>=80?{label:'우수',color:'var(--good)'}:(v>=62?{label:'양호',color:'var(--gold)'}:{label:'보강',color:'var(--bad)'})); }
  function bandPct(v){ return v==null?{label:'자료 없음',color:'var(--faint)'}:(v>=60?{label:'우수',color:'var(--good)'}:(v>=40?{label:'양호',color:'var(--gold)'}:{label:'보강',color:'var(--bad)'})); }
  function bandStage(v){ return v==null?{label:'자료 없음',color:'var(--faint)'}:(v>=75?{label:'충족',color:'var(--good)'}:(v>=50?{label:'주의',color:'var(--gold)'}:{label:'결함',color:'var(--bad)'})); }
  // 팀 평균
  function avg(f){ var a=T.map(f).filter(function(x){return x!=null&&isFinite(x);}); return a.length?Math.round(a.reduce(function(s,x){return s+x;},0)/a.length*10)/10:null; }
  A.innerHTML='';
  [['선수',T.length,''],['평균 구속(포심)',avg(function(t){return t.velo;}),'km/h'],['평균 메카닉',avg(function(t){return t.mechPct;}),'백분위'],['평균 체력',avg(function(t){return t.fitScore;}),'/100']].forEach(function(x){
    var d=document.createElement('div'); d.className='avg';
    d.innerHTML='<div class="k">'+x[0]+'</div><div class="v">'+(x[1]==null?'—':x[1])+(x[2]?' <small>'+x[2]+'</small>':'')+'</div>'; A.appendChild(d);
  });
  function bar(pct,c){ return '<div class="bar"><i style="width:'+Math.max(3,Math.min(100,pct||0))+'%;background:'+c+'"></i></div>'; }
  function render(sortKey){
    var arr=T.slice();
    arr.sort(function(a,b){
      if(sortKey==='name') return String(a.name).localeCompare(String(b.name),'ko');
      var ka={velo:'velo',mech:'mechPct',fit:'fitScore'}[sortKey];
      return (b[ka]==null?-1:b[ka])-(a[ka]==null?-1:a[ka]);
    });
    G.innerHTML='';
    arr.forEach(function(t){
      var a=document.createElement('a'); a.className='card'; a.href='index.html?player='+encodeURIComponent(t.name);
      var mb=bandPct(t.mechPct), fb=bandScore(t.fitScore);
      var bn=t.bottleneck;
      var bb=bn?bandStage(bn.pct):null;
      a.innerHTML=
        '<div class="chead"><div class="nm">'+t.name+'<span class="hand">'+(t.hand==='L'?'좌투':'우투')+'</span>'+(t.n_trials!=null&&t.n_trials<5?'<span class="smalln">표본 '+t.n_trials+'구</span>':'')+'</div>'
        +'<div class="velo"><span class="n">'+(t.velo==null?'—':t.velo)+'</span><span class="u"> km/h</span><div class="u" style="font-size:10px">포심 최고</div></div></div>'
        +'<div class="row"><div class="rlab"><span class="l">메카닉 (동작)</span><span class="v" style="color:'+mb.color+'">'+(t.mechPct==null?'—':t.mechPct+' 백분위 · '+mb.label)+'</span></div>'+bar(t.mechPct,mb.color)+'</div>'
        +'<div class="row"><div class="rlab"><span class="l">체력 (엔진)</span><span class="v" style="color:'+fb.color+'">'+(t.fitScore==null?'—':t.fitScore+' /100 · '+fb.label)+'</span></div>'+bar(t.fitScore,fb.color)+'</div>'
        +(bn?('<div class="bn" style="background:'+bb.color+'14;border:1px solid '+bb.color+'44"><b style="color:'+bb.color+'">이번 주 볼 곳 · '+bn.stage+' '+bb.label+'</b> <span style="color:var(--sub)">(충족률 '+bn.pct+'%)</span></div>')
             :'<div class="bn" style="background:rgba(95,206,143,.1);border:1px solid rgba(95,206,143,.4)"><b style="color:var(--good)">단계 누수 없음</b> <span style="color:var(--sub)">— 현 패턴 유지</span></div>')
        +'<div class="open">리포트 열기 →</div>';
      G.appendChild(a);
    });
  }
  var btns=document.querySelectorAll('.sortbar button');
  btns.forEach(function(b){ b.onclick=function(){ btns.forEach(function(x){x.classList.remove('on');}); b.classList.add('on'); render(b.getAttribute('data-s')); }; });
  render('velo');
})();
</script>
</body>
</html>
